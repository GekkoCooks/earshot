<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0f1a" media="(prefers-color-scheme: dark)" />
    <title>Check in with Earshot</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/student.css" />
    <script type="module" src="/js/student.js"></script>
  </head>
  <body>
    <div class="s-shell">
      <header class="s-top">
        <span class="wordmark" aria-label="Earshot">
          <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><rect x="1" y="12" width="5" height="3.2" rx="1"/><rect x="7.5" y="4.5" width="5" height="3.2" rx="1"/><rect x="14" y="8.5" width="5" height="3.2" rx="1"/></svg>
          Earshot
        </span>
        <span class="s-course" id="course"></span>
      </header>
      <main id="app" class="s-main" aria-live="polite">
        <div class="s-loading" role="status"><i></i><i></i><i></i><span class="visually-hidden">Loading</span></div>
      </main>
    </div>
  </body>
</html>
