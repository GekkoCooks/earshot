<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f7fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12161f" media="(prefers-color-scheme: dark)" />
    <title>Check in with Earshot</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/student.css" />
    <script type="module" src="/js/student.js"></script>
  </head>
  <body>
    <div class="s-shell">
      <header class="s-top">
        <a class="wordmark" href="#" aria-label="Earshot">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="6" cy="12" r="2" fill="currentColor" stroke="none" />
            <path d="M11 7.5a6 6 0 0 1 0 9" />
            <path d="M15 4.5a10 10 0 0 1 0 15" />
          </svg>
          Earshot
        </a>
        <span class="s-course" id="course"></span>
      </header>
      <main id="app" class="s-main" aria-live="polite">
        <div class="s-loading" role="status"><span class="visually-hidden">Loading</span></div>
      </main>
    </div>
  </body>
</html>
