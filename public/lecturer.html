<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f7fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12161f" media="(prefers-color-scheme: dark)" />
    <title>Earshot</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/lecturer.css" />
    <script type="module" src="/js/lecturer/app.js"></script>
  </head>
  <body>
    <header class="l-top">
      <a class="wordmark" href="#/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="6" cy="12" r="2" fill="currentColor" stroke="none" />
          <path d="M11 7.5a6 6 0 0 1 0 9" />
          <path d="M15 4.5a10 10 0 0 1 0 15" />
        </svg>
        Earshot
      </a>
      <nav class="l-crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
      <button class="btn btn-quiet theme-toggle" id="theme" type="button" aria-label="Switch colour theme">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
      </button>
    </header>
    <main id="app" class="l-main"></main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
